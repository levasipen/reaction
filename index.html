<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мега Тест</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #121214;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }
    .box {
      text-align: center;
      background: #1e1e24;
      padding: 15px;
      border-radius: 16px;
      max-width: 450px;
      width: 95%;
      box-sizing: border-box;
      position: relative;
    }
    .modes, .lb-tabs {
      margin-bottom: 10px;
      background: #151518;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    label, .tab-btn {
      margin: 2px 4px;
      font-size: 11px;
      cursor: pointer;
      background: none;
      border: none;
      color: #aaa;
    }
    .tab-btn.active {
      color: #00ff88;
      font-weight: bold;
    }
    .info {
      color: #aaa;
      margin-bottom: 10px;
      font-size: 12px;
      min-height: 35px;
    }
    #zone {
      height: 200px;
      background: #151518;
      border-radius: 12px;
      margin-bottom: 15px;
      position: relative;
      overflow: hidden;
    }
    #target {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: none;
      position: absolute;
      text-align: center;
      font-weight: bold;
    }
    #msg {
      line-height: 200px;
      color: #888;
    }
    #err {
      color: #ff4444;
      font-weight: bold;
      font-size: 24px;
      position: absolute;
      width: 100%;
      line-height: 200px;
      display: none;
    }
    button {
      background: #00ff88;
      color: #121214;
      border: none;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .modal {
      display: none;
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      background: #252530;
      border: 2px solid #00ff88;
      border-radius: 12px;
      padding: 15px;
      z-index: 100;
    }
    .modal input {
      background: #121214;
      border: 1px solid #444;
      color: #fff;
      padding: 6px;
      margin: 5px 0;
      width: 80%;
      border-radius: 4px;
    }
    .leaderboard {
      margin-top: 15px;
      background: #151518;
      border-radius: 8px;
      padding: 10px;
      max-height: 150px;
      overflow-y: auto;
    }
    .lb-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 13px;
      border-bottom: 1px solid #222;
      align-items: center;
    }
    .three-dots {
      cursor: pointer;
      color: #00e1ff;
      padding: 0 5px;
    }
    #auth-screen { display: block; }
    #game-screen { display: none; }
  </style>
</head>
<body>

<!-- ВХОД -->
<div class="box" id="auth-screen">
  <h2>Вход / Регистрация</h2>
  <div id="auth-msg" 
       style="color:#ffcc00; 
              font-size:12px; 
              margin-bottom:10px;">
  </div>
  <input type="text" id="auth-nick" 
         placeholder="Никнейм"><br>
  <input type="email" id="auth-email" 
         placeholder="Email"><br>
  <input type="password" id="auth-pass" 
         placeholder="Пароль"><br><br>
  <button onclick="accountAction('reg')">
    Регистрация
  </button>
  <button onclick="accountAction('login')" 
          style="background:#00e1ff;">
    Войти
  </button>
</div>

<!-- ИГРА -->
<div class="box" id="game-screen">
  <h3 style="margin:5px 0;">
    Игрок: 
    <span id="user-title" 
          style="color:#00ff88;">-</span>
  </h3>
  
  <div id="menu-modal" class="modal">
    <h4 style="margin:5px 0;">
      Управление
    </h4>
    <div id="menu-inputs"></div>
    <br>
    <button onclick="submitMenuAction()">
      Ок
    </button>
    <button onclick="closeMenu()" 
            style="background:#ff4444;">
      Х
    </button>
  </div>

  <div class="modes">
    <label>
      <input type="radio" name="m" 
             value="c" checked 
             onchange="setM()"> Выбор
    </label>
    <label>
      <input type="radio" name="m" 
             value="s" 
             onchange="setM()"> Спринт
    </label>
    <label>
      <input type="radio" name="m" 
             value="k" 
             onchange="setM()"> Цифры
    </label>
    <label>
      <input type="radio" name="m" 
             value="letter" 
             onchange="setM()"> Буквы
    </label>
  </div>

  <div id="info" class="info">
    Зеленый—F. Красный—J.
  </div>

  <div id="zone">
    <div id="msg">Нажмите Старт</div>
    <div id="target"></div>
    <div id="err">ЖУЛИК!</div>
  </div>

  <div style="font-size:13px;">
    Попытка: <b id="cnt">0</b>/10 | 
    Время: <b id="last">0.000</b> с
  </div>

  <button id="btn" onclick="start()" 
          style="margin-top:10px;">
    Старт
  </button>

  <h4 style="margin:15px 0 5px 0;">Топ</h4>
  <input type="text" id="search-input" 
         oninput="renderLB()" 
         placeholder="Поиск по нику..." 
         style="background:#151518; 
                border:1px solid #444; 
                color:#fff; padding:4px; 
                width:70%; 
                border-radius:4px; 
                font-size:12px; 
                margin-bottom:5px;">
  
  <div class="lb-tabs">
    <button class="tab-btn active" 
            id="tab-c" 
            onclick="switchLB('c')">
      Выбор
    </button>
    <button class="tab-btn" 
            id="tab-s" 
            onclick="switchLB('s')">
      Спринт
    </button>
    <button class="tab-btn" 
            id="tab-k" 
            onclick="switchLB('k')">
      Цифры
    </button>
    <button class="tab-btn" 
            id="tab-letter" 
            onclick="switchLB('letter')">
      Буквы
    </button>
  </div>
  
  <div class="leaderboard" 
       id="lb-content"></div>
</div>

<script>
  // ЗАМЕНИТЕ НА СВОИ КЛЮЧИ:
  const S_URL = "https://mhkfedjyrjffnutbsqab.supabase.co/rest/v1/";
  const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1oa2ZlZGp5cmpmZm51dGJzcWFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NDA2NzksImV4cCI6MjEwNjExNjY3OX0.crgRaQC7TWF9Ng1KvztuIpdCl7fu3cjuYXHUxtb_4ZE";
  
  const sb = supabase.createClient(
    S_URL, S_KEY
  );

  let cnt = 0, times = [];
  let run = false, show = false;
  let block = false, col = '';
  let ans = '', t0 = null;
  let timeout = null, mode = 'c';
  let curUser = null, lbMode = 'c';
  let selOpt = '';

  const tg = document.getElementById('target');
  const txt = document.getElementById('msg');
  const num = document.getElementById('cnt');
  const lst = document.getElementById('last');
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  const inf = document.getElementById('info');

  function setM() {
    if (run) return;
    mode = document.querySelector(
      'input[name="m"]:checked'
    ).value;
    if (mode === 'c') {
      inf.innerHTML = 'Зеленый—F. Красный—J.';
    } else if (mode === 's') {
      inf.innerHTML = 'Синий — Пробел (0.3-5с)';
    } else if (mode === 'k') {
      inf.innerHTML = 'Вверху:1,2,3|Внизу:8,9,0';
    } else {
      inf.innerHTML = 'Жми букву A-Z (1-2с)';
    }
    txt.innerText = 'Режим готов';
  }

  async function accountAction(type) {
    const nick = document.getElementById(
      'auth-nick'
    ).value.trim();
    const email = document.getElementById(
      'auth-email'
    ).value.trim();
    const pass = document.getElementById(
      'auth-pass'
    ).value;
    const amsg = document.getElementById(
      'auth-msg'
    );

    if(!nick || !pass) {
      amsg.innerText = "Заполните поля!";
      return;
    }

    if (type === 'reg') {
      const { data: chk } = await sb
        .from('players')
        .select('username')
        .eq('username', nick)
        .maybeSingle();
        
      if (chk) {
        amsg.innerText = "Ник занят!";
        return;
      }

      const { data, error } = await sb
        .auth.signUp({
          email: email, 
          password: pass
        });
        
      if (error) {
        amsg.innerText = error.message;
        return;
      }

      await sb.from('players').insert({
        id: data.user.id, 
        username: nick
      });
      amsg.innerText = "Проверьте почту!";
    } else {
      const { data, error } = await sb
        .auth.signInWithPassword({
          email: email, 
          password: pass
        });
        
      if (error) {
        amsg.innerText = error.message;
        return;
      }

      const { data: pData } = await sb
        .from('players')
        .select('*')
        .eq('id', data.user.id)
        .single();
        
      curUser = pData;

      document.getElementById(
        'auth-screen'
      ).style.display = 'none';
      document.getElementById(
        'game-screen'
      ).style.display = 'block';
      document.getElementById(
        'user-title'
      ).innerText = curUser.username;
      
      loadLB();
    }
  }

  function start() {
    cnt = 0; times = [];
    show = false; block = false; run = true;
    btn.style.display = 'none';
    lst.innerText = '0.000';
    num.innerText = '0';
    err.style.display = 'none';
    btn.blur();
    document.querySelectorAll(
      'input[name="m"]'
    ).forEach(el => el.disabled = true);
    next();
  }

  function next() {
    if (cnt >= 10) { end(); return; }
    show = false; block = false;
    tg.style.display = 'none';
    txt.style.display = 'block';
    txt.innerText = 'Ждите...';
    err.style.display = 'none';
    
    let isS = (mode==='s' || mode==='letter');
    let min = isS ? (mode==='letter'?1000:300) : 500;
    let max = isS ? (mode==='letter'?2000:5000) : 3000;
    let rTime = Math.random() * (max - min) + min;
    
    timeout = setTimeout(go, rTime);
  }

  function go() {
    txt.style.display = 'none';
    tg.innerText = '';
    if (mode === 'c') {
      col = Math.random() < 0.5 ? 'g' : 'r';
      tg.style.backgroundColor = 
        col === 'g' ? '#00ff88' : '#ff4444';
      setRect(100, 100, 'calc(50% - 50px)', 
              'calc(50% - 50px)');
    } else if (mode === 's') {
      col = 'b';
      tg.style.backgroundColor = '#00e1ff';
      setRect(100, 100, 'calc(50% - 50px)', 
              'calc(50% - 50px)');
    } else if (mode === 'k') {
      col = 'y';
      tg.style.backgroundColor = '#ffcc00';
      setRect(30, 30, '0', '0');
      let positions = [
        {k:'1', l:'10px', t:'10px'},
        {k:'2', l:'calc(50% - 15px)', t:'10px'},
        {k:'3', l:'calc(100% - 40px)', t:'10px'},
        {k:'8', l:'10px', t:'calc(100% - 40px)'},
        {k:'9', l:'calc(50% - 15px)', 
               t:'calc(100% - 40px)'},
        {k:'0', l:'calc(100% - 40px)', 
               t:'calc(100% - 40px)'}
      ];
      let pos = positions[
        Math.floor(Math.random() * positions.length)
      ];
      ans = pos.k;
      tg.style.left = pos.l;
      tg.style.top = pos.t;
    } else {
      let abc = 'abcdefghijklmnopqrstuvwxyz';
      ans = abc[
        Math.floor(Math.random() * abc.length)
      ];
      tg.innerText = ans.toUpperCase();
      tg.style.backgroundColor = '#ffcc00';
      tg.style.color = '#121214';
      let rx = Math.floor(Math.random()*370)+10;
      let ry = Math.floor(Math.random()*130)+10;
      setRect(40, 40, rx+'px', ry+'px');
    }
    tg.style.display = 'block';
    show = true;
    t0 = performance.now();
  }

  function setRect(w, h, l, t) {
    tg.style.width = w+'px';
    tg.style.height = h+'px';
    tg.style.left = l;
    tg.style.top = t;
    if(mode==='letter') {
      tg.style.lineHeight = h+'px';
      tg.style.fontSize = '18px';
    }
  }

  window.addEventListener('keydown', (e) => {
    if (!run || block) return;
    let k = e.key.toLowerCase();
    let isC = (mode === 'c' && 
              (k === 'f' || k === 'j'));
    let isS = (mode === 's' && 
               e.code === 'Space');
    let isK = (mode === 'k' && 
               ['1','2','3','8','9','0'].includes(k));
    let isL = (mode === 'letter' && 
               k.length === 1 && 
               k >= 'a' && k <= 'z');
    
    if (!isC && !isS && !isK && !isL) return;
    e.preventDefault();

    if (!show) {
      if (timeout) clearTimeout(timeout);
      reset('ЖУЛИК! (CHEATER!)');
      return;
    }

    let checkC = (col === 'g' && k === 'f') || 
                 (col === 'r' && k === 'j');
    if (mode === 'c' && checkC) ok();
    else if (mode === 's' && e.code === 'Space') ok();
    else if ((mode === 'k' || mode === 'letter') && 
             k === ans) ok();
    else reset('ОШИБКА! СБРОС!');
  });

  function ok() {
    let dt = (performance.now() - t0) / 1000;
    times.push(dt);
    lst.innerText = dt.toFixed(3);
    cnt++;
    num.innerText = cnt;
    show = false;
    tg.style.display = 'none';
    next();
  }

  function reset(m) {
    block = true; show = false;
    tg.style.display = 'none';
    txt.style.display = 'none';
    err.innerText = m;
    err.style.display = 'block';
    cnt = 0; times = [];
    num.innerText = '0';
    lst.innerText = '0.000';
    setTimeout(() => {
      err.style.display = 'none';
      next();
    }, 2000);
  }

  async function end() {
    run = false;
    txt.style.display = 'block';
    txt.innerText = 'Сохранение...';
    document.querySelectorAll(
      'input[name="m"]'
    ).forEach(el => el.disabled = false);
    
    let sum = times.reduce((a, b) => a + b, 0);
    let sc = parseFloat(
      (sum / times.length).toFixed(3)
    );
    
    let f = mode === 'c' ? 'c_test' : 
            mode === 's' ? 's_test' : 
            mode === 'k' ? 'k_test' : 'l_test';
            
    curUser[f] = sc;
    
    await sb.from('players')
      .update({ [f]: sc })
      .eq('id', curUser.id);
    
    txt.innerText = 'Сохранено!';
    btn.style.display = 'inline-block';
    btn.innerText = 'Заново';
    loadLB();
  }

  let glPlayers = [];
  async function loadLB() {
    const { data } = await sb
      .from('players')
      .select('*');
    glPlayers = data || [];
    renderLB();
  }

  function switchLB(tMode) {
    lbMode = tMode;
    document.querySelectorAll('.tab-btn')
      .forEach(b => b.classList.remove('active'));
    document.getElementById(
      `tab-${tMode}`
    ).classList.add('active');
    renderLB();
  }

  function renderLB() {
    const q = document.getElementById(
      'search-input'
    ).value.toLowerCase();
    const c = document.getElementById(
      'lb-content'
    );
    c.innerHTML = '';

    let f = lbMode === 'c' ? 'c_test' : 
            lbMode === 's' ? 's_test' : 
            lbMode === 'k' ? 'k_test' : 'l_test';

    let fil = glPlayers.filter(
      p => p.username.toLowerCase().includes(q)
    );
    fil.sort((a, b) => (a[f] || 999) - (b[f] || 999));

    fil.forEach((p, idx) => {
      const hasAll = p.c_test > 0 && 
                     p.s_test > 0 && 
                     p.k_test > 0 && 
                     p.l_test > 0;
                     
      const sc = hasAll ? 
        (p[f] ? p[f].toFixed(3) : '—') : '—';

      let row = document.createElement('div');
      row.className = 'lb-row';
      row.innerHTML = `
        <span>#${idx+1} <b>${p.username}</b></span>
        <span>${sc} с 
          <span class="three-dots" 
                onclick="openMenu('${p.username}')">
            •••
          </span>
        </span>
      `;
      c.appendChild(row);
    });
  }

  function openMenu(nick) {
    if(nick !== curUser.username) {
      alert("Это не ваш профиль!");
      return;
    }
    const modal = document.getElementById(
      'menu-modal'
    );
    const inputs = document.getElementById(
      'menu-inputs'
    );
    modal.style.display = 'block';
    inputs.innerHTML = `
      <select id="menu-opt" 
              onchange="drawFields()" 
              style="padding:5px;">
        <option value="">-- Выбор --</option>
        <option value="n">1. Ник</option>
        <option value="p">2. Пароль</option>
        <option value="r">3. Сброс</option>
      </select>
      <div id="df"></div>
    `;
  }

  function drawFields() {
    const opt = document.getElementById(
      'menu-opt'
    ).value;
    const div = document.getElementById('df');
    selOpt = opt;
    if(opt === 'n') {
      div.innerHTML = `<input type="text" 
        id="m-n" placeholder="Новый ник">`;
    } else if(opt === 'p') {
      div.innerHTML = `<p style="font-size:10px;">
        Ссылка уйдет на почту.</p>`;
    } else if(opt === 'r') {
      div.innerHTML = `<select id="m-t">
        <option value="c_test">Выбор</option>
        <option value="s_test">Спринт</option>
        <option value="k_test">Цифры</option>
        <option value="l_test">Буквы</option>
      </select>`;
    } else div.innerHTML = '';
  }

  async function submitMenuAction() {
    if(!selOpt) return;
    try {
      if(selOpt === 'n') {
        const nn = document.getElementById(
          'm-n'
        ).value.trim();
        await sb.from('players')
          .update({ username: nn })
          .eq('id', curUser.id);
        curUser.username = nn;
        document.getElementById(
          'user-title'
        ).innerText = nn;
      } else if(selOpt === 'p') {
        await sb.auth.resetPasswordForEmail(
          curUser.email
        );
        alert("Ссылка отправлена!");
      } else if(selOpt === 'r') {
        const t = document.getElementById(
          'm-t'
        ).value;
        await sb.from('players')
          .update({ [t]: 0 })
          .eq('id', curUser.id);
        curUser[t] = 0;
      }
      closeMenu(); loadLB();
    } catch(e) { alert(e.message); }
  }

  function closeMenu() {
    document.getElementById(
      'menu-modal'
    ).style.display = 'none';
  }
</script>
</body>
</html>
