<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reaction Test</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- AUTH WINDOW -->
<div class="box" id="auth-screen">
  <h2>Login / Register</h2>
  <div id="auth-msg" style="color:#ffcc00; font-size:12px; margin-bottom:10px;"></div>
  <input type="text" id="auth-nick" placeholder="Nickname"><br>
  <input type="email" id="auth-email" placeholder="Email"><br>
  <input type="password" id="auth-pass" placeholder="Password"><br><br>
  <button onclick="accountAction('reg')">Register</button>
  <button onclick="accountAction('login')" style="background:#00e1ff;">Login</button>
</div>

<!-- GAME MAIN WINDOW -->
<div class="box" id="game-screen">
  <h3 style="margin:5px 0;">Player: <span id="user-title" style="color:#00ff88;">-</span></h3>
  
  <div id="menu-modal" class="modal">
    <h4 style="margin:5px 0;">Profile Options</h4>
    <div id="menu-inputs"></div>
    <br>
    <button onclick="submitMenuAction()">Confirm</button>
    <button onclick="closeMenu()" style="background:#ff4444;">Close</button>
  </div>

  <div class="modes">
    <label><input type="radio" name="m" value="c" checked onchange="setM()"> Choice</label>
    <label><input type="radio" name="m" value="s" onchange="setM()"> Sprint</label>
    <label><input type="radio" name="m" value="k" onchange="setM()"> Digits</label>
    <label><input type="radio" name="m" value="letter" onchange="setM()"> Letters</label>
  </div>

  <div id="info" class="info">Green—F. Red—J.</div>

  <div id="zone">
    <div id="msg">Click Start</div>
    <div id="target"></div>
    <div id="err">CHEATER!</div>
  </div>

  <div style="font-size:13px;">
    Attempt: <b id="cnt">0</b>/10 | Time: <b id="last">0.000</b> s
  </div>

  <button id="btn" onclick="start()" style="margin-top:10px;">Start</button>

  <h4 style="margin:15px 0 5px 0;">Leaderboard</h4>
  <input type="text" id="search-input" oninput="renderLB()" placeholder="Search user..." style="background:#151518; border:1px solid #444; color:#fff; padding:4px; width:70%; border-radius:4px; font-size:12px; margin-bottom:5px;">
  
  <div class="lb-tabs">
    <button class="tab-btn active" id="tab-c" onclick="switchLB('c')">Choice</button>
    <button class="tab-btn" id="tab-s" onclick="switchLB('s')">Sprint</button>
    <button class="tab-btn" id="tab-k" onclick="switchLB('k')">Digits</button>
    <button class="tab-btn" id="tab-letter" onclick="switchLB('letter')">Letters</button>
  </div>
  
  <div class="leaderboard" id="lb-content"></div>
</div>

<script src="code.js"></script>
</body>
</html>
